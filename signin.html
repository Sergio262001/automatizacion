<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In - AutoFlow</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
  .auth-wrapper { min-height: calc(100vh - 100px); display:flex; align-items:center; justify-content:center; background:#f8fafc;}
  .auth-container { width: 100%; max-width: 400px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
  .auth-container h2 { text-align: center; margin-bottom: 20px; font-size: 28px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #334155; }
  .form-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; transition: border-color 0.2s; font-size:15px; box-sizing: border-box; }
  .form-group input:focus { border-color: #2563eb; }
  .auth-btn { width: 100%; background: #2563eb; color: #fff; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
  .auth-btn:hover { background: #1d4ed8; }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 14px; color: #64748b; }
  .auth-footer a { color: #2563eb; text-decoration: none; font-weight:500; }
  </style>
</head>
<body>
<header class="navbar">
  <div class="logo">
    <a href="index.html" style="text-decoration:none; color:inherit;">⚡ <span>AutoFlow</span></a>
  </div>
  <nav class="nav-links">
    <a href="features.html" data-i18n="nav_features">Features</a>
    <a href="integrations.html" data-i18n="nav_integrations">Integrations</a>
    <a href="pricing.html" data-i18n="nav_pricing">Pricing</a>
    <a href="docs.html" data-i18n="nav_docs">Docs</a>
  </nav>
  <div class="nav-actions">
    <select id="lang-switch" class="lang-selector">
      <option value="en">EN</option>
      <option value="es">ES</option>
    </select>
    <a href="signin.html" class="signin" data-i18n="nav_signin">Sign In</a>
    <a href="get-started.html" class="btn-primary small" data-i18n="nav_getstarted">Get Started</a>
  </div>
</header>
<main class="auth-wrapper">
  <div class="auth-container">
    <h2 data-i18n="auth_h2_in">Welcome Back</h2>
    <form onsubmit="event.preventDefault();">
      <div class="form-group"><label data-i18n="auth_lbl_email">Email</label><input type="email" placeholder="you@example.com"></div>
      <div class="form-group"><label data-i18n="auth_lbl_pass">Password</label><input type="password" placeholder="••••••••"></div>
      <button type="submit" class="auth-btn" data-i18n="auth_btn_in">Sign In</button>
    </form>
    <div class="auth-footer"><span data-i18n="auth_ft_in">Don't have an account? </span><a href="get-started.html" data-i18n="auth_a_up">Sign Up</a></div>
  </div>
</main>
<script src="lang.js"></script>
</body>
</html>
